<svg xmlns="http://www.w3.org/2000/svg" width="440" height="440" viewBox="0 0 440 440" role="img" aria-labelledby="interval-title interval-description">
  <title id="interval-title">An activation walk and its mismatch interval graph</title>
  <desc id="interval-description">For the walk 100 to 101 to 111 to 110, bit 3 differs from its initial state at patterns 2 and 3, and bit 2 differs at patterns 3 and 4. The intervals overlap at pattern 3, creating a graph with two connected vertices.</desc>
  <rect width="440" height="440" fill="#fff" />
  <g font-family="Arial, sans-serif" fill="#23354b">
    <text x="220" y="30" text-anchor="middle" font-size="22" font-weight="600">Activation walk</text>
    <g font-family="monospace" font-size="25" text-anchor="middle">
      <text x="62" y="73">100</text>
      <text x="167" y="73">101</text>
      <text x="272" y="73">111</text>
      <text x="377" y="73">110</text>
    </g>
    <g fill="#6d7c8e" font-size="24" text-anchor="middle">
      <text x="114" y="72">→</text>
      <text x="219" y="72">→</text>
      <text x="324" y="72">→</text>
    </g>
    <text x="220" y="115" text-anchor="middle" font-size="20">Mismatch intervals</text>
    <rect x="250" y="130" width="44" height="120" rx="8" fill="#edf1f7" />
    <g stroke="#c8d1dc" stroke-dasharray="4 5">
      <path d="M62 130v120 M167 130v120 M272 130v120 M377 130v120" />
    </g>
    <text x="16" y="177" font-size="20">Bit 3</text>
    <text x="16" y="233" font-size="20">Bit 2</text>
    <g stroke="#3065a8" stroke-width="10" stroke-linecap="round">
      <path d="M167 170H272" />
    </g>
    <g stroke="#488766" stroke-width="10" stroke-linecap="round">
      <path d="M272 226H377" />
    </g>
    <g fill="#fff" stroke-width="3">
      <circle cx="167" cy="170" r="7" stroke="#3065a8" />
      <circle cx="272" cy="170" r="7" stroke="#3065a8" />
      <circle cx="272" cy="226" r="7" stroke="#488766" />
      <circle cx="377" cy="226" r="7" stroke="#488766" />
    </g>
    <text x="220" y="282" text-anchor="middle" font-size="20">Largest overlap: 2 intervals</text>
    <path d="M28 300H412" stroke="#d9dfe7" />
    <text x="220" y="330" text-anchor="middle" font-size="22" font-weight="600">Interval graph</text>
    <path d="M155 374H285" stroke="#6d7c8e" stroke-width="3" />
    <circle cx="155" cy="374" r="25" fill="#3065a8" />
    <circle cx="285" cy="374" r="25" fill="#488766" />
    <g fill="#fff" font-size="22" text-anchor="middle">
      <text x="155" y="382">I₃</text>
      <text x="285" y="382">I₂</text>
    </g>
    <text x="220" y="426" text-anchor="middle" font-size="20">2 vertices, joined by one edge</text>
  </g>
</svg>
